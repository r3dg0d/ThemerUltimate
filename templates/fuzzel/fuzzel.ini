# {{mark}}
# deep-space — fuzzel · re-rice 2026-10-19
[main]
font={{font_ui}}:size=13,{{font_icons}}:size=13
use-bold=yes
prompt="{{launcher_prompt}}"
placeholder={{launcher_placeholder}}
terminal=ghostty -e
layer=overlay
anchor=center
width=40
lines=9
horizontal-pad=24
vertical-pad=18
inner-pad=12
line-height=30
letter-spacing=0.4
image-size-ratio=0.5
icons-enabled=yes
icon-theme={{icon_theme}}
match-counter=yes
show-actions=no
fields=filename,name,generic,keywords
dpi-aware=no

[colors]
background={{base_nohash}}f5
text={{text2_nohash}}ff
prompt={{primary_nohash}}ff
placeholder={{dim_nohash}}ff
input={{ink_nohash}}ff
match={{light_nohash}}ff
selection={{sel_nohash}}ff
selection-text={{ink_nohash}}ff
selection-match={{primary_nohash}}ff
counter={{dim_nohash}}ff
border={{accent_nohash}}dd

[border]
width=2
radius={{r:18}}
selection-radius={{r:12}}
